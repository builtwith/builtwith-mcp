name: Stage BuiltWith MCP on npm

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to stage
        required: true
        type: string
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      # - run: npm test  # Uncomment when you have tests

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npx --yes npm@11.15.0 stage publish --access public  # Add --access public if scoped package
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
